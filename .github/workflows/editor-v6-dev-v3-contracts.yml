name: Editor V6 - Dev-v3 focused contracts

on:
  push:
    branches: [Dev-v3]
  pull_request:
    branches: [Dev-v3]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-v6-dev-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  focused-contracts:
    name: V6 / types, boundaries and preview-export contracts
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.5'
          cache: npm
      - name: Install without Electron postinstall hooks
        run: npm ci --ignore-scripts
      - name: Validate Dev-v3 local clone BAT and dependency workflow
        run: node --test tests/windows/dev-v3-local-workflow.test.cjs
      - name: Parse safe PowerShell updater without running its Git actions
        shell: pwsh
        run: |
          $errors = $null
          $tokens = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile('scripts/windows/atualizar-dev-v3.ps1', [ref]$tokens, [ref]$errors)
          if ($errors.Count -gt 0) { $errors | Out-String | Write-Host; throw 'PowerShell de update tem erros de sintaxe.' }
      - name: Check TypeScript contracts
        run: npm run typecheck
      - name: Check architecture boundaries
        run: npm run audit:architecture
      - name: Test offline Dev-v3 compositor and frame contract
        run: npm run test:editor-v6:engine-v3
      - name: Profile offline synthetic full HD raster and memory (non-benchmark)
        run: npm run profile:editor-v6:engine-v3 -- --width=1920 --height=1080 --frames=4 --atlas=512

      - name: Regressions from the 14 Dev-V2 performance commits
        run: npx vitest run --config vitest.editor-v6.config.ts tests/editor-v6/editorV6DocumentEditing.test.ts tests/editor-v6/editorV6FaceAppearancePreparation.test.ts tests/editor-v6/editorV6PosePreparation.test.ts tests/editor-v6/editorV6ReactImport.test.ts tests/editor-v6/editorV6TimelinePointerCommands.test.ts tests/editor-v6/exportFrameAssetImageLoader.test.ts tests/editor-v6/exportHairFrameComposer.test.ts tests/editor-v6/exportHairSceneComposition.test.ts tests/editor-v6/exportIpcLifecycle.test.ts tests/editor-v6/exportMouthLoop.test.ts tests/editor-v6/exportVisibleFrameAssets.test.ts tests/editor-v6/exportWorkerHairResources.test.ts tests/editor-v6/exportWorkerHairRuntime.test.ts tests/editor-v6/hairSourceBatch.test.ts
      - name: Storage and media regressions from Dev-V2
        run: node --experimental-strip-types --import ./scripts/testing/register-typescript-extensions.mjs --test tests/asset-manifest-transaction.test.mjs tests/editor-v6-data-sources.test.mjs tests/media-protocol-registration.test.mjs tests/video-library-domainfs.test.cjs
      - name: Verify V6 motion cache, overlay timebase and preview parity
        run: npx vitest run --config vitest.editor-v6.config.ts tests/editor-v6/editorV6Motion.test.ts tests/editor-v6/editorV6ExportParity.test.ts tests/editor-v6/editorV6VideoTimebase.test.ts tests/editor-v6/sceneVideoLayer.test.ts tests/editor-v6/engineV6FrameAdapter.test.ts tests/editor-v6/engineV6SvgReference.test.ts tests/editor-v6/engineV6Timebase.test.ts tests/editor-v6/engineV6ChromiumReference.test.ts
