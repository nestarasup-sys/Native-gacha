# GitHub-hosted Windows x64 is Windows Server 2025, NOT Windows 11.
# Real Windows 11 x64 + AMD AMF performance acceptance runs on the user's PC.
name: Editor V6 - parity and export contracts

on:
  pull_request:
    branches: [Dev-V2, dev-v2-zona-de-guerra]
  push:
    branches: [Dev-V2, dev-v2-zona-de-guerra]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-v6-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  general-gates:
    name: Dev-V2 / architecture, shared contracts and typecheck
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install without Electron postinstall hooks
        run: npm ci --ignore-scripts
      - name: Audit architecture boundaries
        run: npm run audit:architecture
      - name: Verify refactor contracts
        run: npm run test:refactor
      - name: Verify shared character geometry
        run: npm run test:geometry
      - name: TypeScript validation
        run: npm run typecheck

  test:
    name: Editor V6 parity / Windows x64
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install without Electron postinstall hooks
        run: npm ci --ignore-scripts
      - name: Verify quick Windows-only gate definitions
        run: node --test tests/editor-v6/rapidWindowsGates.test.cjs
      - name: Verify the standard export panel has one primary action
        run: node --test tests/editor-v6/exportSingleButton.test.cjs
      - name: Editor V6 timeline, export and scene tests
        run: npm run test:editor-v6
      - name: Build bundle required by Windows export parity
        run: npm run build
      - name: Upload Windows production bundle
        uses: actions/upload-artifact@v4
        with:
          name: editor-v6-windows-bundle
          path: |
            out/main/**
            out/preload/**
            out/renderer/**
          if-no-files-found: error
          retention-days: 1

  mp4-overlay:
    name: Real MP4 pixel parity / Windows
    needs: test
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install npm packages
        run: npm ci --ignore-scripts
      - name: Install Electron runtime for real offscreen frames
        run: node node_modules/electron/install.js
      - name: Download Windows production bundle
        uses: actions/download-artifact@v4
        with:
          name: editor-v6-windows-bundle
          path: out/
      - name: Prepare verified LGPL FFmpeg tools
        shell: pwsh
        run: |
          $videoTools = Join-Path $env:RUNNER_TEMP 'native-gacha-editor-v6-video-tools'
          ./scripts/video-studio/prepare-ffmpeg-lgpl.ps1 -DestinationPath $videoTools
          "EDITOR_V6_TEST_VIDEO_TOOLS_DIR=$videoTools" >> $env:GITHUB_ENV
      - name: 'Validate warm motion service: exact endpoint atlas parity and rig-count reduction'
        run: node scripts/editor-v6/check-motion-service.cjs
      - name: Verify native RGBA of single-pass face composition in isolated Electron
        run: node scripts/editor-v6/check-motion.cjs
      - name: Validate experimental export-only hair animation on synthetic fixtures
        run: node scripts/editor-v6/check-hair-motion-export.cjs
      - name: Compare real Turbo MP4 pixels with timeline
        run: node scripts/editor-v6/check-overlay-parity.cjs
      - name: Validate native facial composition and real 720p/1080p MP4
        run: node scripts/editor-v6/check-face-export.cjs
      - name: Preserve synthetic test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-v6-overlay-parity
          path: |
            out/editor-v6-overlay-parity/result.json
            out/editor-v6-face-export-check/**
            out/editor-v6-hair-motion-check/**
          if-no-files-found: ignore
          retention-days: 5
