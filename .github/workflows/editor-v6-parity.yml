name: Editor V6 - parity and export contracts

on:
  pull_request:
    branches: [Dev-V2]
    paths:
      - 'src/renderer/src/features/editorV6/**'
      - 'src/shared/editorV6*'
      - 'electron/domains/editorV6/**'
      - 'tests/editor-v6/**'
      - 'docs/editor-v6/**'
      - '.github/workflows/editor-v6-parity.yml'
  push:
    branches: [Dev-V2]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: editor-v6-parity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Editor V6 parity / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install without Electron postinstall hooks
        run: npm ci --ignore-scripts
      - name: Editor V6 timeline, export and scene tests
        run: npm run test:editor-v6
      - name: TypeScript validation
        run: npm run typecheck
      - name: Build Electron and renderer
        run: npm run build

  mp4-overlay:
    name: Real MP4 pixel parity / Windows
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'
          cache: npm
      - name: Install npm packages
        run: npm ci --ignore-scripts
      - name: Install Electron runtime for real offscreen frames
        run: node node_modules/electron/install.js
      - name: Prepare verified LGPL FFmpeg tools
        shell: pwsh
        run: ./scripts/video-studio/prepare-ffmpeg-lgpl.ps1
      - name: Build Electron export worker
        run: npm run build
      - name: Compare real Turbo MP4 pixels with timeline
        run: node scripts/editor-v6/check-overlay-parity.cjs
      - name: Preserve synthetic test summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: editor-v6-overlay-parity
          path: out/editor-v6-overlay-parity/result.json
          if-no-files-found: ignore
          retention-days: 5
